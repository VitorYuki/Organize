<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f4f5f4" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#171918" media="(prefers-color-scheme: dark)">
<title>Sem conexão · Organize</title>
<style>
:root{color-scheme:light dark;--paper:#f4f5f4;--ink:#1b201e;--accent:#146449;--on-accent:#fff}
@media(prefers-color-scheme:dark){:root{--paper:#171918;--ink:#f0f3f0;--accent:#8bd0ad;--on-accent:#14251d}}
*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:1rem/1.45 system-ui,sans-serif}
main{max-width:28rem;margin:auto;min-height:100svh;display:flex;flex-direction:column;justify-content:center;padding:2rem}
strong{color:var(--accent)}h1{font-size:2rem;line-height:1.1;letter-spacing:-.04em;margin:1rem 0 0}
a{display:flex;align-items:center;min-height:44px;width:fit-content;padding:.55rem .9rem;border-radius:9px;background:var(--accent);color:var(--on-accent);text-decoration:none;font-weight:650}
a:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
</style>
</head>
<body><main><strong>Organize</strong><h1>Você está sem conexão.</h1><p>Reconecte-se para consultar ou alterar suas tarefas, compromissos, notas e listas.</p><a href="/">Tentar novamente</a></main></body></html>
